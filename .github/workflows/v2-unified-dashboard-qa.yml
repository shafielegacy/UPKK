name: UPKK V2 Unified Dashboard QA
on:
  push:
    branches:
      - feature/v2-unified-dashboard-shell-qa
    paths:
      - 'index.html'
      - 'admin-2027.js'
      - 'parent-2027.js'
      - 'native-admin-shell-2027.css'
      - 'native-parent-shell-2027.css'
      - 'admin-2027-config.js'
      - 'parent-2027-config.js'
      - 'edaftar-config.js'
      - 'sw.js'
      - 'tests/unified-dashboard-static.test.cjs'
      - '.github/workflows/v2-unified-dashboard-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout QA source
        uses: actions/checkout@v4
      - name: Syntax - Admin Native
        run: node --check admin-2027.js
      - name: Syntax - Parent Native
        run: node --check parent-2027.js
      - name: Static release preflight (no network to GAS)
        run: node tests/unified-dashboard-static.test.cjs
